# -----------------------------------------------------------------------------
# MSSP — Not applicable (enterprise deployment)
# -----------------------------------------------------------------------------
# Contoso is NOT an MSSP. This section is commented out but preserved
# as reference if Contoso decides to offer managed services to subsidiaries.
managed_customers: []
