name: KQL Validation

on:
  pull_request:
    paths:
      - "**/*.kql"
      - "templates/kql/**"
      - "skills/kql/**"
      - "lib/kql-validator/**"

jobs:
  validate-kql:
    name: Validate KQL Queries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm ci

      # KQL validation runs via lib/kql-validator which checks:
      #   - Syntax correctness (operator usage, pipe chains, function calls)
      #   - Table name references against known Sentinel/Defender schemas
      #   - Common anti-patterns (unbounded time ranges, missing project/summarize)
      #
      # Once lib/kql-validator is fully built, this step calls it directly.
      # For now, we do a basic structural check on .kql files.
      - name: Validate KQL files
        run: |
          echo "🔍 Scanning for KQL files..."
          KQL_FILES=$(find . -name "*.kql" -not -path "./node_modules/*" -not -path "./.git/*")
          
          if [ -z "$KQL_FILES" ]; then
            echo "✅ No KQL files found — nothing to validate."
            exit 0
          fi

          echo "Found KQL files:"
          echo "$KQL_FILES" | while read f; do echo "  📄 $f"; done

          ERRORS=0
          echo "$KQL_FILES" | while read f; do
            # Basic checks: file is not empty, has at least one KQL operator
            if [ ! -s "$f" ]; then
              echo "❌ $f is empty"
              ERRORS=$((ERRORS + 1))
            fi
          done

          if [ $ERRORS -gt 0 ]; then
            echo "❌ $ERRORS validation error(s) found"
            exit 1
          fi

          echo "✅ All KQL files pass basic validation"

      - name: Report results
        if: always()
        run: echo "KQL validation complete"
