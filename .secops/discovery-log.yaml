# =============================================================================
# .secops/discovery-log.yaml — Agent-Discovered Environment Facts
# =============================================================================
# Agents append entries here when they discover facts about the environment
# during normal operations (investigations, hunts, deployments). Human
# operators review entries and promote confirmed facts to the authoritative
# YAML files (data-source-map.yaml, workspaces/*.yaml, etc.).
#
# Schema Version: 1.0
#
# AGENT INSTRUCTIONS:
#   1. Append new entries to the `discoveries` list below
#   2. Always include: timestamp, agent, confidence, fact, source
#   3. Include structured data fields when applicable (data_source, location, etc.)
#   4. Never modify or delete existing entries — this is an append-only log
#   5. Use ISO 8601 timestamps with timezone offset
#
# HUMAN INSTRUCTIONS:
#   1. Review entries periodically
#   2. Promote confirmed facts to the appropriate authoritative YAML file
#   3. Mark promoted entries with `promoted_to: <file>` (optional)
#   4. Archive old entries by moving to a separate file if the log grows large
# =============================================================================

schema_version: "1.0"

# -----------------------------------------------------------------------------
# Discovery Entry Schema Reference
# -----------------------------------------------------------------------------
# Each discovery entry follows this schema:
#
# Required fields:
#   timestamp    — ISO 8601 datetime when the fact was discovered
#   agent        — Name of the agent that discovered the fact
#   confidence   — Confidence level: high | medium | low
#                  high   = confirmed via direct query/API result
#                  medium = inferred from indirect evidence
#                  low    = assumption based on naming/patterns
#   fact         — Human-readable description of what was discovered
#   source       — How the agent discovered this (query, API call, error message, etc.)
#
# Optional structured data fields (include when applicable):
#   data_source  — Table or data source name (e.g., "SecurityEvent")
#   location     — Where the data lives: sentinel | adx | external
#   workspace    — Workspace short name (references .secops/workspaces/)
#   cluster      — ADX cluster name
#   database     — ADX database name
#   tier         — Data tier: Analytics | Basic | Auxiliary | Archive
#   tenant_id    — Entra ID tenant GUID
#   region       — Azure region
#   notes        — Additional context for the human reviewer
#   promoted_to  — File path where this fact was promoted (set by human)

# -----------------------------------------------------------------------------
# Discoveries — Append-only log of agent-discovered facts
# -----------------------------------------------------------------------------
discoveries: []

# Example entries (uncomment to use as reference):
#
# - timestamp: "2026-04-30T15:05:00-05:00"
#   agent: "freamon"
#   confidence: "high"
#   fact: "SecurityEvent table exists in workspace soc-sentinel-prod"
#   source: "KQL query: SecurityEvent | take 1 — returned results"
#   data_source: "SecurityEvent"
#   location: "sentinel"
#   workspace: "example-workspace"
#
# - timestamp: "2026-04-30T15:06:00-05:00"
#   agent: "kima"
#   confidence: "medium"
#   fact: "NetFlowLogs found in ADX cluster soc-adx-prod, database SecurityLake"
#   source: "Cross-cluster query during investigation"
#   data_source: "NetFlowLogs"
#   location: "adx"
#   cluster: "soc-adx-prod"
#   database: "SecurityLake"
#
# - timestamp: "2026-04-30T15:07:00-05:00"
#   agent: "freamon"
#   confidence: "high"
#   fact: "Workspace uses Basic Logs tier for NetFlowLogs_CL"
#   source: ".show table NetFlowLogs_CL policy — confirmed Basic tier via error"
#   data_source: "NetFlowLogs_CL"
#   tier: "Basic"
#   notes: "High volume table, search-only access is sufficient"
#
# - timestamp: "2026-04-30T15:10:00-05:00"
#   agent: "herc"
#   confidence: "low"
#   fact: "Logic App managed identity may not have Sentinel Responder role"
#   source: "Deployment error: 'AuthorizationFailed' on incident update"
#   notes: "Needs manual verification — could be transient RBAC propagation"
