# =============================================================================
# .secops/data-sources/data-source-map.yaml — Data Source Location Map
# =============================================================================
# THE KEY FILE agents consult before writing queries. Maps each data table
# to its physical location (Sentinel workspace, ADX cluster, or external).
#
# Agents MUST check this file before assuming where a table lives.
# If a table is not listed, the agent should query the default workspace
# and append findings to discovery-log.yaml.
#
# Schema Version: 1.0
# Template: Replace example entries with your actual data sources.
# =============================================================================

schema_version: "1.0"

# -----------------------------------------------------------------------------
# Sources — Keyed by table name
# -----------------------------------------------------------------------------
# Each entry describes where a specific data table lives and how to access it.
# Keys are table names as they appear in KQL queries.
sources:

  # --- Sentinel Analytics Tier tables ---

  SecurityEvent:
    # Where the data physically resides
    location: "sentinel"          # sentinel | adx | external
    # Reference to workspace file in .secops/workspaces/<name>.yaml
    workspace: "example-workspace"
    # Data tier — determines available KQL operators
    #   Analytics — full KQL (join, summarize, etc.)
    #   Basic     — search-only, no join/summarize
    #   Auxiliary  — lowest cost, search-only, limited retention
    #   NOTE: "Auxiliary" is now called "Sentinel data lake" in modern terminology
    #   Archive   — must restore before querying
    tier: "Analytics"
    # Approximate daily ingestion volume in GB
    daily_gb: 12
    # How data enters this table
    ingestion_method: "ama-agent"  # ama-agent | mma-agent | api | dcr | connector | s3-to-eventhub
    notes: "Windows Security Events via Azure Monitor Agent"

  SigninLogs:
    location: "sentinel"
    workspace: "example-workspace"
    tier: "Analytics"
    daily_gb: 3
    ingestion_method: "connector"
    notes: "Entra ID diagnostic settings"

  DeviceProcessEvents:
    location: "sentinel"
    workspace: "example-workspace"
    tier: "Analytics"
    daily_gb: 8
    ingestion_method: "connector"
    notes: "Microsoft Defender for Endpoint connector"

  # --- Sentinel Basic Tier tables ---

  AWSCloudTrail:
    location: "sentinel"
    workspace: "example-workspace"
    tier: "Basic"
    daily_gb: 15
    ingestion_method: "s3-to-eventhub"
    # Source cloud metadata for cross-cloud correlation
    source_cloud: "aws"           # azure | aws | gcp | on-premises
    notes: "Ingested via S3 → Event Hub → DCR pipeline"

  # --- ADX tables ---

  NetFlowLogs:
    location: "adx"
    # For ADX tables, specify cluster and database instead of workspace
    cluster: "soc-adx-prod"
    database: "SecurityLake"
    tier: "Analytics"             # ADX tables are always full-query capable
    daily_gb: 200
    ingestion_method: "streaming-ingestion"
    notes: "Migrated from Sentinel 2025-11 for cost savings"

  HistoricalFirewallLogs:
    location: "adx"
    cluster: "soc-adx-prod"
    database: "Archive"
    tier: "Archive"
    daily_gb: 0                   # No new ingestion — historical only
    ingestion_method: "external-table"
    notes: "Pre-2025 firewall data, cold storage, external table over blob"

  # --- GCP cross-cloud example ---

  # GCPAuditLog:
  #   location: "sentinel"
  #   workspace: "example-workspace"
  #   tier: "Basic"
  #   daily_gb: 5
  #   ingestion_method: "pub-sub-to-sentinel"
  #   source_cloud: "gcp"
  #   gcp_project: "security-logging-prod"
  #   notes: "GCP audit logs via Pub/Sub to Sentinel connector"

  # --- Agent-discovered entry example ---
  # Entries discovered by agents include provenance fields.
  # These should be reviewed by a human before relying on them.

  # ExampleDiscoveredTable:
  #   location: "sentinel"
  #   workspace: "example-workspace"
  #   tier: "Analytics"
  #   daily_gb: 1
  #   discovered_by: "freamon"      # Which agent found this
  #   discovered_at: "2026-04-30"   # When it was discovered
  #   confidence: "high"            # high | medium | low

# -----------------------------------------------------------------------------
# Cross-Cloud Identity Mapping
# -----------------------------------------------------------------------------
# When correlating across clouds, agents need to know how identities
# are mapped between Azure (Entra UPN), AWS (IAM ARN), and GCP (Google ID).
cross_cloud_identity_mapping:
  # Mapping method for cross-cloud user correlation
  method: "none"                  # email-based | custom-table | none
  # If method is "custom-table", specify the mapping table name
  # mapping_table: "CrossCloudIdentityMap_CL"
  # notes: "Maps AWS IAM users to Entra ID UPNs for correlation"
