# =============================================================================
# .secops/data-sources/migrations.yaml — Data Migration Tracking
# =============================================================================
# Tracks active, planned, and completed data migrations between platforms.
# Agents MUST check this before recommending data source changes or writing
# queries that assume a table's location is stable.
#
# Schema Version: 1.0
# Template: Replace example entries with your actual migrations.
# =============================================================================

schema_version: "1.0"

# -----------------------------------------------------------------------------
# Migrations — Data movement between platforms
# -----------------------------------------------------------------------------
# Each migration describes a data source moving from one location to another.
# During "in-progress" migrations, data may exist in BOTH locations.
migrations:

  - id: "mig-001"
    # Migration status:
    #   planned      — approved but not started
    #   in-progress  — actively migrating, data may exist in both locations
    #   completed    — migration done, source decommissioned
    #   cancelled    — migration abandoned
    status: "in-progress"
    description: "Moving NetFlowLogs from ADX to Sentinel data lake"

    # Source — where data currently lives
    source:
      location: "adx"
      cluster: "soc-adx-prod"
      database: "SecurityLake"
      table: "NetFlowLogs"

    # Target — where data is moving to
    target:
      location: "sentinel"
      workspace: "example-workspace"
      table: "NetFlowLogs_CL"
      tier: "Sentinel data lake"

    # Timeline
    started: "2026-03-15"
    estimated_completion: "2026-06-01"

    # Responsible person/team
    owner: "jospaid"

    notes: >
      Sentinel data lake now cheaper than ADX for this volume.
      Running parallel ingestion until validated. Agents should query
      BOTH locations during migration and prefer the target when available.

  - id: "mig-002"
    status: "planned"
    description: "Consolidate dev Sentinel workspace into prod"

    source:
      location: "sentinel"
      workspace: "dev-sentinel"

    target:
      location: "sentinel"
      workspace: "example-workspace"

    # For planned migrations, use planned_start instead of started
    planned_start: "2026-Q3"
    estimated_completion: "2026-Q4"

    owner: "soc-platform-team"

    notes: >
      Waiting for cross-workspace RBAC improvements in Sentinel.
      No action required from agents until status changes to in-progress.

  # Template for adding new migrations:
  # - id: "mig-NNN"
  #   status: "planned"            # planned | in-progress | completed | cancelled
  #   description: "Brief description of what's moving and why"
  #   source:
  #     location: "sentinel"       # sentinel | adx | external
  #     workspace: "source-ws"     # or cluster/database for ADX
  #     table: "TableName"
  #   target:
  #     location: "sentinel"
  #     workspace: "target-ws"
  #     table: "TableName_CL"
  #     tier: "Analytics"          # Analytics | Basic | Sentinel data lake
  #   planned_start: "YYYY-MM-DD"
  #   estimated_completion: "YYYY-MM-DD"
  #   owner: "person-or-team"
  #   notes: "Context for agents about how to handle this migration"
