# =============================================================================
# .secops/compliance/requirements.yaml — Regulatory & Compliance Requirements
# =============================================================================
# Defines data residency constraints, regulatory framework impacts, and
# minimum retention requirements. Agents MUST check this before deploying
# resources, moving data, or recommending retention changes.
#
# Schema Version: 1.0
# Template: Replace example values with your compliance requirements.
# =============================================================================

schema_version: "1.0"

# -----------------------------------------------------------------------------
# Data Residency — Where data is allowed to live
# -----------------------------------------------------------------------------
# These constraints override all other considerations. Agents MUST NOT deploy
# resources or move data to prohibited regions.
data_residency:
  # Primary region for all SOC data and infrastructure
  primary_region: "eastus2"

  # Regions where SOC data and resources MAY be deployed
  allowed_regions:
    - "eastus2"
    - "eastus"
    - "centralus"
    - "westus2"

  # Regions where SOC data MUST NOT be deployed (hard constraint)
  # Agents must refuse to deploy or move data to these regions
  prohibited_regions: []
  # Example for EU-only deployment:
  # prohibited_regions:
  #   - "eastus"
  #   - "eastus2"
  #   - "westus"
  #   - "centralus"

  # Reason for residency constraints — helps agents explain to users
  reason: "Corporate policy — US data residency for all SOC data"

  # Additional constraints agents must enforce
  constraints: []
  # Example GDPR constraints:
  # constraints:
  #   - "No data export to non-EU regions"
  #   - "ADX cluster must be in EU regions"
  #   - "Playbook execution must be in EU regions"
  #   - "Threat intel enrichment: only EU endpoints for MDTI"

# -----------------------------------------------------------------------------
# Regulatory Frameworks — Applicable regulations and their impact
# -----------------------------------------------------------------------------
# Each framework entry describes how a regulation affects SOC operations.
# Agents should reference applicable frameworks in detection rules and
# incident response procedures.
regulatory_frameworks: []
# Example entries:
#
# - name: "GDPR"
#   description: "EU General Data Protection Regulation"
#   # Areas of SOC operations this regulation impacts
#   impact:
#     - "data-retention"          # Minimum/maximum retention requirements
#     - "purge-on-request"        # Must support data subject access requests
#     - "region-lock"             # Data must stay in EU
#     - "breach-notification-72h" # 72-hour breach notification requirement
#
# - name: "PCI-DSS"
#   description: "Payment Card Industry Data Security Standard"
#   impact:
#     - "data-retention"          # 1-year minimum for security logs
#     - "access-logging"          # All access to cardholder data must be logged
#     - "quarterly-scanning"      # Quarterly vulnerability scans required
#
# - name: "NIS2"
#   description: "EU Network and Information Security Directive v2"
#   impact:
#     - "incident-reporting-24h"  # 24-hour incident reporting to CSIRT
#     - "supply-chain-monitoring" # Monitor third-party security posture
#
# - name: "DORA"
#   description: "Digital Operational Resilience Act (financial services)"
#   impact:
#     - "ict-risk-management"     # ICT risk management framework required
#     - "resilience-testing"      # Regular resilience testing
#
# - name: "FedRAMP"
#   description: "Federal Risk and Authorization Management Program"
#   impact:
#     - "data-residency-us"       # US-only data residency
#     - "continuous-monitoring"   # Continuous monitoring required
#     - "il4-controls"            # Impact Level 4 security controls

# -----------------------------------------------------------------------------
# Retention Requirements — Minimum retention by data type
# -----------------------------------------------------------------------------
# Regulatory minimums that override workspace defaults. Agents MUST check
# these before recommending retention changes or writing queries that span
# long time ranges.
retention_requirements:

  # Default retention settings (used when no specific override exists)
  default:
    interactive_days: 90
    archive_days: 730
    total_days: 820

  # Per-table or per-category overrides
  overrides: []
  # Example overrides:
  #
  # - table: "SecurityEvent"
  #   interactive_days: 365
  #   archive_days: 2555           # 7 years total
  #   reason: "PCI-DSS Requirement 10.7 — 1 year online, 7 years total"
  #
  # - table: "SigninLogs"
  #   interactive_days: 180
  #   archive_days: 730
  #   reason: "Identity forensics need 6 months interactive access"
  #
  # - table: "NetFlowLogs_CL"
  #   interactive_days: 30
  #   archive_days: 90
  #   tier: "Basic"
  #   reason: "High volume, short retention sufficient for network forensics"

  # Guidance for agents when working with retention
  agent_guidance:
    - "Check retention before writing queries with timespan > 90 days"
    - "Archive restore takes 1-5 minutes — factor into investigation time"
    - "Basic tier tables cannot use join/summarize — use search operator instead"
    - "ADX tables have configurable retention but different query syntax via adx() proxy"
