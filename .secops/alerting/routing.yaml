# =============================================================================
# .secops/alerting/routing.yaml — Alert Routing Configuration
# =============================================================================
# Defines how alerts are routed to teams, channels, and ticketing systems
# based on severity, product, MITRE tactic, and custom criteria.
#
# Rules are evaluated in order — first match wins.
# If no rule matches, the alert goes to default_channel.
#
# Schema Version: 1.0
# Template: Replace example values with your alert routing config.
# =============================================================================

schema_version: "1.0"

# -----------------------------------------------------------------------------
# Defaults — Applied when no specific rule matches
# -----------------------------------------------------------------------------

# Default notification channel for unmatched alerts
default_channel: "teams://soc-general"

# Minimum severity to generate a notification (below this = silent/log only)
# Values: Informational | Low | Medium | High | Critical
default_severity_threshold: "Medium"

# -----------------------------------------------------------------------------
# Routes — Ordered alert routing rules (first match wins)
# -----------------------------------------------------------------------------
routes:

  # --- Critical/High endpoint alerts → dedicated channel with fast SLA ---
  - match:
      # Match criteria — all specified fields must match (AND logic)
      # For arrays, alert must match ANY value in the list (OR within field)
      severity: ["High", "Critical"]
      product: ["Microsoft Defender for Endpoint"]
    destination:
      # Destination type: teams | slack | pagerduty | email | ticket | webhook
      type: "teams"
      channel: "soc-endpoint-alerts"
      # Optional: mention a specific person or group
      mention: "@oncall-endpoint"
    # SLA in minutes — expected response time for this route
    sla_minutes: 15

  # --- Identity alerts → identity team ---
  - match:
      severity: ["High", "Critical"]
      product: ["Microsoft Entra ID Protection", "Microsoft Defender for Identity"]
    destination:
      type: "teams"
      channel: "soc-identity-alerts"
      mention: "@oncall-identity"
    sla_minutes: 30

  # --- Exfiltration tactics → PagerDuty (highest urgency) ---
  - match:
      mitre_tactic: ["Exfiltration"]
    destination:
      type: "pagerduty"
      service_id: "PXXXXXX"
    sla_minutes: 5

  # --- Cloud security alerts → cloud team ---
  - match:
      severity: ["Medium", "High", "Critical"]
      product: ["Microsoft Defender for Cloud"]
    destination:
      type: "teams"
      channel: "soc-cloud-security"
    sla_minutes: 60

  # --- Low/Info alerts → ticketing system ---
  - match:
      severity: ["Informational", "Low"]
    destination:
      type: "ticket"
      system: "servicenow"        # servicenow | jira | azure-devops
      assignment_group: "SOC-L1"
      # Optional: ticket priority mapping
      # priority: "P4"
    sla_minutes: 480              # 8 hours

  # Template for adding new routes:
  # - match:
  #     severity: ["High"]
  #     product: ["Product Name"]
  #     mitre_tactic: ["Tactic"]
  #     # Custom match fields can be added — agents will pattern-match
  #     # tags: ["custom-tag"]
  #   destination:
  #     type: "teams"             # teams | slack | pagerduty | email | ticket | webhook
  #     channel: "channel-name"
  #     # For webhook: url: "https://..."
  #     # For email: recipients: ["soc@contoso.com"]
  #     # For ticket: system: "servicenow", assignment_group: "SOC-L1"
  #   sla_minutes: 30
