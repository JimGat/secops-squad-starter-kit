# =============================================================================
# .secops/alerting/escalation.yaml — Escalation Procedures
# =============================================================================
# Defines escalation tiers with timeouts and contacts. When an alert exceeds
# its SLA without acknowledgement, it escalates to the next tier.
#
# Schema Version: 1.0
# Template: Replace example values with your escalation procedures.
# =============================================================================

schema_version: "1.0"

# -----------------------------------------------------------------------------
# Escalation Tiers — Progressive escalation with timeouts
# -----------------------------------------------------------------------------
# Tiers are triggered sequentially when SLA is breached. Each tier adds
# additional contacts and increases urgency.
tiers:

  # Tier 1 — Initial response (SOC L1 analyst)
  - tier: 1
    name: "SOC L1 — Initial Triage"
    # Minutes after alert creation before escalating to next tier
    timeout_minutes: 15
    contacts:
      - type: "team"
        name: "SOC L1 On-Call"
        channel: "teams://soc-alerts"
    actions:
      - "Acknowledge alert"
      - "Initial triage and classification"
      - "Assign to investigator if valid"

  # Tier 2 — Escalated response (SOC L2 analyst)
  - tier: 2
    name: "SOC L2 — Investigation"
    timeout_minutes: 30
    contacts:
      - type: "team"
        name: "SOC L2 Investigation"
        channel: "teams://soc-investigations"
      - type: "individual"
        name: "SOC Shift Lead"
        # Contact method: teams | email | phone | pagerduty
        method: "teams"
        handle: "@soc-shift-lead"
    actions:
      - "Deep investigation"
      - "Containment actions if needed"
      - "Notify SOC lead"

  # Tier 3 — Management escalation (SOC Lead / Manager)
  - tier: 3
    name: "SOC Lead — Management Response"
    timeout_minutes: 60
    contacts:
      - type: "individual"
        name: "SOC Manager"
        method: "phone"
        handle: "+1-555-0100"
      - type: "individual"
        name: "CISO (after hours)"
        method: "pagerduty"
        handle: "PXXXXXX"
    actions:
      - "Executive notification"
      - "Incident commander assignment"
      - "Consider external IR engagement"

  # Tier 4 — Executive / Crisis (CISO + Legal)
  - tier: 4
    name: "Executive — Crisis Response"
    timeout_minutes: 120
    contacts:
      - type: "individual"
        name: "CISO"
        method: "phone"
        handle: "+1-555-0101"
      - type: "individual"
        name: "Legal Counsel"
        method: "email"
        handle: "legal-security@contoso.com"
      - type: "team"
        name: "Crisis Management Team"
        channel: "teams://crisis-management"
    actions:
      - "Activate incident response plan"
      - "Legal and compliance notification"
      - "External communications preparation"
      - "Regulatory notification assessment"

# -----------------------------------------------------------------------------
# Severity Overrides — Skip tiers for critical alerts
# -----------------------------------------------------------------------------
# Some alert severities bypass lower tiers entirely.
severity_overrides:
  Critical:
    # Critical alerts start at Tier 2 (skip Tier 1 triage)
    start_tier: 2
    # Reduced timeout — escalate faster for critical alerts
    timeout_multiplier: 0.5
    notes: "Critical alerts skip L1 triage, go directly to investigation"

  # High severity uses default escalation path
  # High:
  #   start_tier: 1
  #   timeout_multiplier: 1.0

# -----------------------------------------------------------------------------
# After-Hours Policy
# -----------------------------------------------------------------------------
after_hours:
  # Timezone for determining business hours
  timezone: "America/Chicago"
  # Business hours definition
  business_hours:
    start: "08:00"
    end: "18:00"
    days: ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"]
  # After-hours adjustments
  adjustments:
    # Multiplier applied to all tier timeouts after hours
    timeout_multiplier: 1.5
    # Additional contact for after-hours escalation
    # on_call_contact:
    #   name: "After-Hours On-Call"
    #   method: "pagerduty"
    #   handle: "PXXXXXX"
