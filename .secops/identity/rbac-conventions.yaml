# =============================================================================
# .secops/identity/rbac-conventions.yaml — RBAC Naming & Assignment Conventions
# =============================================================================
# Standardized naming patterns, role assignment templates, and PIM configuration
# for security groups and roles. Agents MUST follow these patterns when creating
# or recommending RBAC configurations.
#
# Schema Version: 1.0
# Template: Replace example values with your organization's conventions.
# =============================================================================

schema_version: "1.0"

# -----------------------------------------------------------------------------
# Naming Patterns — Security group naming conventions
# -----------------------------------------------------------------------------
# Consistent naming enables automated discovery and policy enforcement.
# Agents MUST use these patterns when creating or recommending security groups.
naming_patterns:

  # Pattern for security groups
  # Variables: {scope} = resource scope, {role} = role name, {env} = environment
  security_groups: "sg-{scope}-{role}-{env}"
  # Examples:
  #   sg-sentinel-contributor-prod
  #   sg-sentinel-reader-dev
  #   sg-adx-admin-prod

  # Pattern for Entra ID role-assignable groups
  role_assignable_groups: "rag-{role}-{purpose}"
  # Examples:
  #   rag-security-reader-soc-l1
  #   rag-security-admin-soc-lead

  # Pattern for PIM-eligible groups
  pim_groups: "pim-{role}-{scope}"
  # Examples:
  #   pim-sentinel-responder-prod
  #   pim-global-admin-break-glass

  # Pattern for application registrations used by SOC
  app_registrations: "app-soc-{purpose}-{env}"
  # Examples:
  #   app-soc-soar-playbooks-prod
  #   app-soc-graph-security-prod

# -----------------------------------------------------------------------------
# Role Assignment Templates — Standard role bundles
# -----------------------------------------------------------------------------
# Pre-defined role bundles for common SOC personas. Agents use these when
# recommending access configurations.
role_templates:

  # SOC Level 1 — Triage analysts
  soc_l1:
    description: "Triage analysts — read access, can update incidents"
    assignments:
      - role: "Microsoft Sentinel Reader"
        scope: "sentinel-workspace"
      - role: "Microsoft Sentinel Responder"
        scope: "sentinel-workspace"
      - role: "Security Reader"
        scope: "tenant"
    group: "sg-sentinel-responder-prod"

  # SOC Level 2 — Investigation analysts
  soc_l2:
    description: "Investigation analysts — can create rules and hunting queries"
    assignments:
      - role: "Microsoft Sentinel Contributor"
        scope: "sentinel-workspace"
      - role: "Log Analytics Contributor"
        scope: "log-analytics-workspace"
      - role: "Security Reader"
        scope: "tenant"
    group: "sg-sentinel-contributor-prod"

  # SOC Level 3 / Engineering — Full Sentinel + SOAR
  soc_l3:
    description: "Detection engineers and SOAR developers"
    assignments:
      - role: "Microsoft Sentinel Contributor"
        scope: "sentinel-workspace"
      - role: "Logic App Contributor"
        scope: "soar-resource-group"
      - role: "Log Analytics Contributor"
        scope: "log-analytics-workspace"
      - role: "Monitoring Contributor"
        scope: "dcr-resource-group"
    group: "sg-sentinel-engineer-prod"

  # SOC Lead / Manager — Administrative access
  soc_lead:
    description: "SOC leadership — workspace admin, can manage data connectors"
    assignments:
      - role: "Microsoft Sentinel Contributor"
        scope: "sentinel-workspace"
      - role: "Log Analytics Contributor"
        scope: "log-analytics-workspace"
      - role: "Security Admin"
        scope: "tenant"
    group: "sg-sentinel-admin-prod"

# -----------------------------------------------------------------------------
# PIM Configuration — Privileged Identity Management conventions
# -----------------------------------------------------------------------------
# Which roles require just-in-time (JIT) activation via PIM.
pim:
  # Whether PIM is enforced for privileged roles
  enabled: true

  # Roles that require PIM activation (not permanently assigned)
  eligible_roles:
    - role: "Global Administrator"
      max_duration_hours: 2
      require_justification: true
      require_approval: true
      approvers: ["soc-lead-group"]
      notes: "Break-glass only, requires SOC lead approval"

    - role: "Security Admin"
      max_duration_hours: 8
      require_justification: true
      require_approval: false
      notes: "SOC leads can self-activate with justification"

    - role: "Microsoft Sentinel Contributor"
      max_duration_hours: 8
      require_justification: true
      require_approval: false
      notes: "Standard activation for detection engineering work"

  # Roles that are permanently assigned (no PIM)
  permanent_roles:
    - role: "Security Reader"
      notes: "Read-only, always available for SOC analysts"
    - role: "Microsoft Sentinel Reader"
      notes: "Read-only, always available"
