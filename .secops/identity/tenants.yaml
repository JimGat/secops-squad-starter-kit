# =============================================================================
# .secops/identity/tenants.yaml — Multi-Tenant Topology
# =============================================================================
# Describes the tenant landscape the SOC operates across. Critical for agents
# that need to understand cross-tenant relationships, Lighthouse delegations,
# and access boundaries.
#
# Schema Version: 1.0
# Template: Replace example values with your tenant topology.
# =============================================================================

schema_version: "1.0"

# -----------------------------------------------------------------------------
# Tenants — All Entra ID / Azure AD tenants in scope
# -----------------------------------------------------------------------------
# Comprehensive list of tenants the SOC interacts with. Each tenant has a type
# that determines access model and agent behavior.
tenants:

  - id: "aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee"
    name: "Contoso Production"
    # Tenant type:
    #   primary              — main organizational tenant, full admin access
    #   secondary            — additional org tenant (dev/test, subsidiary, M&A)
    #   managed              — MSSP-managed customer, full admin delegated
    #   lighthouse-delegated — Azure Lighthouse scoped access (limited roles/scopes)
    #   csp                  — Cloud Solution Provider relationship
    type: "primary"
    # Cloud environment for this tenant
    cloud: "azure-commercial"     # azure-commercial | azure-government | azure-china
    notes: "Primary Contoso tenant, all SOC personnel have accounts here"

  - id: "ffffffff-gggg-hhhh-iiii-jjjjjjjjjjjj"
    name: "Contoso Dev/Test"
    type: "secondary"
    cloud: "azure-commercial"
    notes: "Dev/test environment, mirrors prod Sentinel config for testing rules"

  # --- MSSP / Lighthouse examples (uncomment and customize) ---

  # - id: "11111111-aaaa-bbbb-cccc-dddddddddddd"
  #   name: "Woodgrove Bank"
  #   type: "lighthouse-delegated"
  #   cloud: "azure-commercial"
  #   notes: "Lighthouse-delegated customer, SOC manages Sentinel + response"

  # - id: "22222222-aaaa-bbbb-cccc-dddddddddddd"
  #   name: "Fabrikam Industries"
  #   type: "managed"
  #   cloud: "azure-commercial"
  #   notes: "Fully managed customer, MSSP has Global Admin"

  # --- Government cloud example ---

  # - id: "33333333-aaaa-bbbb-cccc-dddddddddddd"
  #   name: "Contoso GovCloud"
  #   type: "secondary"
  #   cloud: "azure-government"
  #   notes: "FedRAMP High environment, IL4 workloads"

# -----------------------------------------------------------------------------
# Cross-Tenant Access — B2B and Lighthouse settings
# -----------------------------------------------------------------------------
# Describes how tenants connect to each other. Agents need this to understand
# what operations are possible across tenant boundaries.
cross_tenant_access:

  # B2B (Guest Access) settings
  b2b:
    # Whether B2B guest access is used for cross-tenant operations
    enabled: false
    # Tenants that accept B2B guests from the primary tenant
    # target_tenants:
    #   - tenant_id: "ffffffff-gggg-hhhh-iiii-jjjjjjjjjjjj"
    #     access_level: "member"    # member | guest
    #     notes: "SOC analysts have guest access to dev/test"

  # Azure Lighthouse delegations
  lighthouse:
    # Whether Lighthouse is used for any cross-tenant management
    enabled: false
    # Delegation details — which resources are delegated and with what roles
    # delegations:
    #   - customer_tenant: "11111111-aaaa-bbbb-cccc-dddddddddddd"
    #     customer_name: "Woodgrove Bank"
    #     delegated_roles:
    #       - "Microsoft Sentinel Contributor"
    #       - "Microsoft Sentinel Responder"
    #       - "Log Analytics Reader"
    #     delegated_scopes:
    #       - "/subscriptions/xxx/resourceGroups/rg-soc-woodgrove"
    #     # Hard limitations — agents MUST respect these boundaries
    #     limitations:
    #       - "No Entra ID access in customer tenant"
    #       - "No Key Vault access"
    #       - "Cannot manage users or groups"
    #       - "Playbooks require customer-side managed identity"
    #       - "Cannot create or modify Conditional Access policies"
