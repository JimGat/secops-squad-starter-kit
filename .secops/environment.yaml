# =============================================================================
# .secops/environment.yaml — Primary Environment Descriptor
# =============================================================================
# The root configuration file for secops-squad customer environment knowledge.
# Agents read this FIRST to understand the tenant, subscription, and cloud
# context before performing any operations.
#
# Schema Version: 1.0
# Template: Replace "Contoso Corp" values with your environment data.
# Docs: See .secops/README.md for the full framework overview.
# =============================================================================

schema_version: "1.0"

# -----------------------------------------------------------------------------
# Organization — Top-level identity and cloud context
# -----------------------------------------------------------------------------
organization:
  # Display name of the customer organization
  name: "Contoso Corp"

  # Cloud environment type. Determines API endpoints, feature availability,
  # and compliance boundaries.
  # Values: azure-commercial | azure-government | azure-china | azure-stack
  cloud: "azure-commercial"

  # Primary Azure region for SOC infrastructure.
  # Used as default for workspace lookups and SOAR deployments.
  primary_region: "eastus2"

  # Data residency zone. Constrains where agents look for data and where
  # they can deploy resources. Use ISO 3166-1 country codes or region names.
  data_residency: "us"

  # Organization type. Determines which schema sections are relevant.
  # "enterprise" — single org, own tenants
  # "mssp" — managed security service provider, manages other orgs' tenants
  org_type: "enterprise"    # enterprise | mssp

# -----------------------------------------------------------------------------
# Tenants — Azure AD / Entra ID tenant topology
# -----------------------------------------------------------------------------
# List all tenants the SOC operates in or manages. For MSSP scenarios,
# include both the management tenant and customer tenants.
tenants:
  - id: "aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee"
    name: "Contoso Production"
    # Tenant type determines access model and agent behavior:
    #   primary              — main org tenant, full access
    #   secondary            — additional org tenant (dev/test, subsidiary)
    #   managed              — MSSP-managed customer tenant (full admin)
    #   lighthouse-delegated — Azure Lighthouse delegated access (scoped)
    #   csp                  — Cloud Solution Provider relationship
    type: "primary"

  - id: "ffffffff-gggg-hhhh-iiii-jjjjjjjjjjjj"
    name: "Contoso Dev/Test"
    type: "secondary"

# -----------------------------------------------------------------------------
# Subscriptions — Azure subscriptions used by the SOC
# -----------------------------------------------------------------------------
# Map subscriptions to tenants and describe their purpose so agents know
# where to deploy resources and find data.
subscriptions:
  - id: "11111111-2222-3333-4444-555555555555"
    name: "SOC-Production"
    # Reference to tenant ID from the tenants[] list above
    tenant: "aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee"
    # Free-text description of what this subscription holds.
    # Agents use this to find the right subscription for deployments.
    purpose: "sentinel, soar-playbooks"

  - id: "66666666-7777-8888-9999-000000000000"
    name: "SOC-ADX"
    tenant: "aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee"
    purpose: "adx-cluster, long-term-retention"

# -----------------------------------------------------------------------------
# Default Workspace — Primary workspace reference
# -----------------------------------------------------------------------------
# Points to a file in .secops/workspaces/<name>.yaml
# Agents use this as the default target when no workspace is specified.
default_workspace: "example-workspace"

# -----------------------------------------------------------------------------
# Lighthouse — Azure Lighthouse delegations (for MSSP or cross-tenant)
# -----------------------------------------------------------------------------
# Defines delegated access relationships. Critical for agents to understand
# permission boundaries — Lighthouse access is scoped, not full-tenant.
# Remove or leave empty if not using Lighthouse.
lighthouse:
  delegations: []
  # Example delegation entry:
  # - customer_tenant: "cust-tenant-id-here"
  #   customer_name: "Customer A"
  #   # Roles delegated to the managing tenant's users
  #   delegated_roles:
  #     - "Microsoft Sentinel Contributor"
  #     - "Log Analytics Reader"
  #   # Scopes — resource-level, not full-subscription
  #   delegated_scopes:
  #     - "/subscriptions/xxx/resourceGroups/rg-soc"
  #   # Hard limitations agents MUST respect
  #   limitations:
  #     - "No Entra ID access in customer tenant"
  #     - "No Key Vault access"
  #     - "Playbooks require customer-side managed identity"

# -----------------------------------------------------------------------------
# Managed Customers — MSSP customer list
# -----------------------------------------------------------------------------
# Only relevant when org_type is "mssp". Lists customers whose security
# operations are managed by this organization.
# Remove or leave empty for enterprise deployments.
managed_customers: []
# Example entry:
# - name: "Customer A"
#   tenant_id: "cust-a-tenant-id"
#   # How the MSSP accesses this customer's environment
#   access_type: "lighthouse"     # lighthouse | guest-account | csp | direct
#   delegated_subscriptions:
#     - id: "sub-1"
#       delegated_rg: ["rg-soc-*"]
#   sentinel_workspace: "cust-a-sentinel"
#   notes: "Lighthouse delegated, Sentinel Contributor + LA Reader"
#
# - name: "Customer B"
#   tenant_id: "cust-b-tenant-id"
#   access_type: "guest-account"
#   notes: "B2B guest, limited to specific workspace"
