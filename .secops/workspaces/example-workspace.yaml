# =============================================================================
# .secops/workspaces/example-workspace.yaml — Workspace Configuration
# =============================================================================
# Describes a single Log Analytics workspace or ADX cluster. Create one file
# per workspace. Reference from environment.yaml via default_workspace or
# from data-source-map.yaml via the workspace field.
#
# Schema Version: 1.0
# Template: Replace example values with your workspace details.
# =============================================================================

schema_version: "1.0"

# -----------------------------------------------------------------------------
# Workspace Identity
# -----------------------------------------------------------------------------

# Azure resource name of the Log Analytics workspace
name: "soc-sentinel-prod"

# Log Analytics workspace GUID (found in Azure Portal → workspace → Properties)
workspace_id: "aabbccdd-1234-5678-abcd-ef0123456789"

# Resource group containing this workspace
resource_group: "rg-soc-prod"

# Azure subscription ID (must match an entry in environment.yaml subscriptions[])
subscription: "11111111-2222-3333-4444-555555555555"

# Azure region where this workspace is deployed
# Agents check this against compliance/requirements.yaml data residency rules
region: "eastus2"

# -----------------------------------------------------------------------------
# Sentinel Configuration
# -----------------------------------------------------------------------------

# Whether Microsoft Sentinel is enabled on this workspace
sentinel_enabled: true

# Pricing tier for the workspace
# Values: PerGB2018 | CapacityReservation
tier: "PerGB2018"

# Commitment tier in GB/day (only applies when tier is CapacityReservation)
# Set to null or omit when tier is PerGB2018
commitment_tier_gb: null

# -----------------------------------------------------------------------------
# Retention Configuration
# -----------------------------------------------------------------------------
# Retention settings determine how long data is available for queries.
# Agents MUST check these before writing queries with long time ranges.
retention:
  # Default retention for all tables (unless overridden per-table)
  default_days: 90

  # Interactive retention — data available for full KQL queries
  interactive_days: 90

  # Archive retention — data available only via search jobs / restore
  # Total retention = interactive + archive
  archive_days: 730

# -----------------------------------------------------------------------------
# Custom Tables — Tables with non-default configuration
# -----------------------------------------------------------------------------
# List tables that use non-standard tiers, custom DCRs, or have notable
# volume characteristics. Agents check this before writing queries.
#
# Tier impacts:
#   Analytics — Full KQL support (join, summarize, etc.)
#   Basic     — Search-only queries, no join/summarize, lower cost
#   Auxiliary  — Lowest cost, search-only, limited retention options
#              NOTE: Now called "Sentinel data lake" in modern Microsoft terminology
custom_tables:
  - name: "NetFlowLogs_CL"
    # Data tier affects which KQL operators are available
    tier: "Basic"                 # Analytics | Basic | Auxiliary (Sentinel data lake)
    # Approximate daily ingestion volume in GB
    daily_gb: 45
    notes: "High-volume network flow data, search-only queries"

  - name: "CustomThreatIntel_CL"
    tier: "Analytics"
    daily_gb: 0.5
    # Data Collection Rule ID for custom ingestion
    dcr_id: "dcr-xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
    # Data Collection Endpoint for ingestion API
    dce_endpoint: "https://dce-contoso.eastus2.ingest.monitor.azure.com"

  - name: "AWSCloudTrail_CL"
    tier: "Basic"
    daily_gb: 15
    notes: "AWS CloudTrail via S3 → Event Hub → DCR pipeline"

# -----------------------------------------------------------------------------
# Data Connectors — Connected data sources
# -----------------------------------------------------------------------------
# Track which data connectors are active and what tables they populate.
# Agents use this to understand data availability.
data_connectors:
  - name: "Microsoft Defender for Endpoint"
    # Connector status
    status: "connected"           # connected | disconnected | degraded | pending
    # Tables populated by this connector
    tables:
      - "DeviceProcessEvents"
      - "DeviceNetworkEvents"
      - "DeviceFileEvents"
      - "DeviceLogonEvents"

  - name: "Microsoft Entra ID"
    status: "connected"
    tables:
      - "SigninLogs"
      - "AuditLogs"
      - "AADNonInteractiveUserSignInLogs"
      - "AADServicePrincipalSignInLogs"

  - name: "CEF via AMA"
    status: "connected"
    tables:
      - "CommonSecurityLog"
    notes: "Palo Alto and Fortinet firewalls via syslog forwarder"

  - name: "AWS S3 Connector"
    status: "connected"
    tables:
      - "AWSCloudTrail"
    notes: "S3 → Event Hub → DCR ingestion pipeline"

  - name: "Microsoft Defender for Cloud"
    status: "connected"
    tables:
      - "SecurityAlert"
      - "SecurityRecommendation"

# -----------------------------------------------------------------------------
# Naming Conventions — Patterns for Sentinel resources
# -----------------------------------------------------------------------------
# Agents MUST follow these patterns when creating analytics rules, watchlists,
# workbooks, or other Sentinel resources.
naming_conventions:
  # Pattern for analytics rule names
  # Variables: {severity}, {mitre_tactic}, {description}
  analytics_rules: "{severity}-{mitre_tactic}-{description}"

  # Pattern for watchlist aliases
  # Variables: {purpose}, {source}
  watchlists: "wl-{purpose}-{source}"

  # Pattern for workbook names
  # Variables: {domain}, {description}
  workbooks: "wb-{domain}-{description}"

  # Pattern for automation rules
  # Variables: {action}, {trigger}
  automation_rules: "ar-{action}-{trigger}"
